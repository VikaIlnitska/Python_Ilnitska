version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_ilnitska
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 7481
      POSTGRES_DB: market_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ilnitska
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: vika_ilnitska@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata: